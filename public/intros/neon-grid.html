<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Grid — SWRV Intro Template</title>
<!--
  ══════════════════════════════════════════════════════════════
  SWRV INTRO TEMPLATE · "NEON GRID"  (synthwave / tech / nightlife)
  ══════════════════════════════════════════════════════════════
  EDIT: title + subtitle in the HTML (search "EDIT:").
        Change --neon + --neon2 + --bg for a different glow.
  ══════════════════════════════════════════════════════════════
-->
<style>
  :root{ --neon:#00d1b2; --neon2:#9d4edd; --bg:#05030c; --ink:#e8ecf4; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);font-family:'Courier New',monospace;overflow:hidden}

  .page{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 120%,#12083a,var(--bg) 70%);color:var(--ink);text-align:center;padding:24px}
  .page h1{font-size:clamp(34px,7vw,72px);font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    text-shadow:0 0 20px var(--neon)}
  .page p{color:rgba(232,236,244,.6);font-size:15px;margin:18px 0 26px;max-width:420px;line-height:1.7}
  .page a{padding:14px 34px;border:1px solid var(--neon);color:var(--neon);font-weight:700;letter-spacing:.15em;
    text-transform:uppercase;font-size:13px;text-decoration:none;box-shadow:0 0 20px rgba(0,209,178,.3),inset 0 0 20px rgba(0,209,178,.1)}

  .intro{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:hidden;
    display:flex;align-items:center;justify-content:center;animation:fade .8s ease 4.4s forwards}
  .intro.gone{display:none}

  /* perspective grid floor */
  .grid{position:absolute;bottom:0;left:50%;width:200%;height:60%;transform:translateX(-50%) perspective(300px) rotateX(70deg);
    background-image:linear-gradient(var(--neon) 1px,transparent 1px),linear-gradient(90deg,var(--neon) 1px,transparent 1px);
    background-size:40px 40px;opacity:0;animation:gridin 1.2s ease .2s forwards, gridmove 2s linear .2s infinite}
  .sun{position:absolute;top:32%;left:50%;transform:translate(-50%,-50%);width:40vw;height:40vw;max-width:360px;max-height:360px;
    border-radius:50%;background:radial-gradient(circle,var(--neon2),transparent 62%);opacity:0;filter:blur(2px);
    animation:sunin 1.4s ease .5s forwards}

  .lock{position:relative;text-align:center;z-index:3}
  .t{font-size:clamp(40px,9vw,110px);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#fff;
    opacity:0;animation:glitchin 1s steps(2) 1.1s forwards, neon 2.2s ease 2.1s infinite alternate}
  .s{font-size:clamp(11px,2vw,15px);letter-spacing:.6em;text-transform:uppercase;color:var(--neon);margin-top:18px;
    opacity:0;animation:up 1s ease 2.1s forwards}
  .scan{position:absolute;inset:0;z-index:4;pointer-events:none;
    background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.25) 2px 4px);opacity:.4;mix-blend-mode:overlay}

  @keyframes gridin{to{opacity:.6}}
  @keyframes gridmove{to{background-position:0 40px}}
  @keyframes sunin{to{opacity:.85}}
  @keyframes glitchin{0%{opacity:0;transform:translateX(-8px) skewX(8deg)}40%{opacity:1;transform:translateX(6px) skewX(-6deg)}
    60%{transform:translateX(-3px)}100%{opacity:1;transform:none}}
  @keyframes neon{from{text-shadow:0 0 8px var(--neon),0 0 18px var(--neon)}to{text-shadow:0 0 16px var(--neon),0 0 40px var(--neon2)}}
  @keyframes up{to{opacity:1}}
  @keyframes fade{to{opacity:0}}

  .controls{position:fixed;bottom:22px;right:22px;z-index:20;display:flex;gap:10px}
  .controls button{background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;
    padding:8px 16px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-family:Arial}
  .controls button:hover{border-color:var(--neon);color:var(--neon)}
</style>
</head>
<body>
  <div class="page">
    <h1>Enter the grid.</h1>
    <p>The opener glowed in, then dropped your visitor into the experience.</p>
    <a href="#">Launch</a>
  </div>

  <div class="intro" id="intro">
    <div class="grid"></div>
    <div class="sun"></div>
    <div class="lock">
      <!-- EDIT: main title -->
      <div class="t">YOUR NAME</div>
      <!-- EDIT: subtitle -->
      <div class="s">Now Streaming</div>
    </div>
    <div class="scan"></div>
  </div>

  <div class="controls">
    <button onclick="location.reload()">↻ Replay</button>
    <button onclick="document.getElementById('intro').classList.add('gone')">Skip →</button>
  </div>

<script>
  setTimeout(()=>document.getElementById('intro').classList.add('gone'), 5200);
</script>
</body>
</html>
