# ════════════════════════════════════════════════════════════
# GitGuardian configuration
# ════════════════════════════════════════════════════════════
# The recurring "1 secret uncovered" finding on this repo is the Supabase
# PUBLISHABLE anon key. That key is designed to ship in client-side code —
# it identifies the project and carries only the `anon` role, with access
# governed by Row Level Security on the Supabase side. It is not a
# credential that can be misused on its own, so it is not a leak.
#
# It legitimately appears in browser-delivered files:
#   - portal/src/lib/supabase.ts   (client app, bundled into the browser)
#   - public/iu76-proposal.html    (static page, runs in the browser)
#
# The Worker (src/worker.js) reads it from the environment instead, so no
# key is hardcoded server-side.
#
# NOTE: GitGuardian also scans git HISTORY. Because this key exists in
# earlier commits, the dashboard incident must be resolved once at
# dashboard.gitguardian.com for the check to go green permanently.
# ════════════════════════════════════════════════════════════
version: 2

secret:
  ignored_paths:
    # Client-side bundles — a publishable key belongs here by design.
    - 'portal/src/lib/supabase.ts'
    - 'public/iu76-proposal.html'
    # Build output (mirrors public/) and dependencies.
    - 'dist/**'
    - 'node_modules/**'
    - '**/package-lock.json'
