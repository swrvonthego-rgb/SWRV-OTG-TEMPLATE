name: Generate Narration MP3s

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you regenerating? (optional)'
        required: false
        default: 'Refresh narration audio'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve API key from secret
        id: key
        env:
          K1: ${{ secrets.ELEVENLABS_API_KEY }}
          K2: ${{ secrets.ELEVEN_LABS_API_KEY }}
          K3: ${{ secrets.ELEVENLABS_KEY }}
          K4: ${{ secrets.ELEVENLABS }}
        run: |
          for v in K1 K2 K3 K4; do
            VAL="${!v}"
            if [ -n "$VAL" ]; then
              echo "::add-mask::$VAL"
              echo "key=$VAL" >> "$GITHUB_OUTPUT"
              echo "✓ Found secret (length: ${#VAL}, prefix: ${VAL:0:4}…)"
              exit 0
            fi
          done
          echo "::error::No ElevenLabs API key secret found."
          exit 1

      - name: Generate narration MP3s (capturing all output)
        env:
          ELEVENLABS_API_KEY: ${{ steps.key.outputs.key }}
        run: |
          set +e
          node scripts/generate-narration.mjs 2>&1 | tee /tmp/script.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "── SCRIPT EXIT STATUS: $STATUS ──"
          if [ $STATUS -ne 0 ]; then
            echo ""
            echo "::group::Last 40 lines of script output (errors below)"
            tail -40 /tmp/script.log
            echo "::endgroup::"
            # Surface the most relevant error lines as annotations
            grep -iE "error|fail|invalid|unauthor|not found|quota|rate" /tmp/script.log | tail -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $STATUS
          fi

      - name: Show generated files
        run: ls -la public/audio/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "🎙 Regenerate narration MP3s — ${{ github.event.inputs.reason }}"
            git push
          fi
